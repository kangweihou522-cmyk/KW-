name: Build Windows download (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node electron/build.cjs --win --dir --x64 --publish never
      - run: node scripts/package-download.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: PaperDesk-Windows
          path: |
            release/downloads/*.zip
            release/downloads/SHA256SUMS.txt
