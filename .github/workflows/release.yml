name: Build Windows download (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-quality-translation.cjs win32 x64
      - name: Real Hy-MT2 Windows inference
        run: node scripts/translation/quality-smoke.cjs
      - run: npm test
      - run: npm run build
      - name: Windows PowerShell automatic updater transactions
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windowsUpdater.integration.ps1
      - name: Real Windows HTTPS and native curl fallback
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windowsUpdater.transport.ps1
      - name: Actual Electron reading and editing checks
        run: node scripts/desktop-smoke.cjs
      - run: node electron/build.cjs --win --dir --x64 --publish never
      - name: Verify packaged Windows program
        run: node scripts/desktop-smoke.cjs --packaged
      - run: node scripts/package-download.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: PaperDesk-Windows
          path: |
            release/downloads/*.zip
            release/downloads/SHA256SUMS.txt
